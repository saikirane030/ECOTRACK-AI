# .streamlit/config.toml
#
# Streamlit server configuration for EcoTrack AI.
# This file is safe to commit — it contains no secrets.
# Secrets (API keys) are added through the Streamlit Cloud UI.

[server]
headless = true          # Required for Streamlit Cloud deployment
# Note: enableCORS and enableXsrfProtection are mutually exclusive.
# Streamlit Cloud manages CORS and CSRF automatically — leave both at defaults.

[browser]
gatherUsageStats = false  # Do not send usage data to Streamlit

[theme]
primaryColor = "#16A34A"        # Green — matches sustainability theme
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f7f8fa"
textColor = "#1f2328"
font = "sans serif"
